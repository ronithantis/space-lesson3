<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>כמה רחוקים הם באמת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d8b46a;--cream:#f1e3c2;--ink:#eef2f8}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:Heebo,system-ui,sans-serif;color:var(--ink)}
svg{position:fixed;inset:0;width:100%;height:100%;display:block}
.tip{position:fixed;transform:translate(-50%,-100%);background:rgba(6,12,28,.88);border:1px solid rgba(216,180,106,.55);border-radius:10px;padding:8px 14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.tip b{display:block;font-size:max(18px,1.7vw);font-weight:700}
.tip span{display:block;font-size:max(14px,1.2vw);color:#cfd8e8}
.tip.on{opacity:1}
#read{border-color:rgba(216,180,106,.9)}
#read b{color:#ffe2a6}
#yr{position:fixed;transform:translate(-50%,-100%);font-size:max(17px,1.6vw);font-weight:700;color:#ffe2a6;text-shadow:0 0 10px rgba(0,0,0,.9);opacity:0;transition:opacity .4s;white-space:nowrap;pointer-events:none;text-align:center}
#yr small{display:block;font-weight:400;color:#d6dcea;font-size:.8em}
</style></head><body>
<svg id="sv" aria-hidden="true"></svg>
<div class="tip" id="hov"><b></b><span class="a"></span><span class="b"></span></div>
<div class="tip" id="read"><b></b><span class="a"></span></div>
<div id="yr"></div>
<script>
/* Planet positions measured in the 1920x1080 background image: the Sun is at x=38, y=540, and the image uses
   about 59.8 px per astronomical unit, so every planet sits at its true average distance. */
const IMG = {w:1920, h:1080, sunX:38, y:540, au:59.8};
const P = [
  {n:'כוכב חמה', au:.39,  km:'כ-58 מיליון ק"מ',   r:3.2, c:'#b3aca2'},
  {n:'נוגה',     au:.72,  km:'כ-108 מיליון ק"מ',  r:4.6, c:'#ecdcb4'},
  {n:'כדור הארץ', au:1,   km:'כ-150 מיליון ק"מ',  r:4.8, c:'#4f8fd8'},
  {n:'מאדים',    au:1.52, km:'כ-228 מיליון ק"מ',  r:3.8, c:'#d0603e'},
  {n:'צדק',      au:5.2,  km:'כ-778 מיליון ק"מ',  r:14,  c:'#d8b58c'},
  {n:'שבתאי',    au:9.54, km:'כ-1.4 מיליארד ק"מ', r:11.5, c:'#e2cf9c', ring:true},
  {n:'אורנוס',   au:19.2, km:'כ-2.9 מיליארד ק"מ', r:8.5, c:'#9fd8dc'},
  {n:'נפטון',    au:30.1, km:'כ-4.5 מיליארד ק"מ', r:8.5, c:'#5577e6'}];
const fmt = au => au === 1 ? 'צעד אחד מהשמש' : (au === 30.1 ? 'כ-30 צעדים מהשמש' : `${au} צעדים מהשמש`);
const PROBE_AT = +(new URLSearchParams(location.search).get('probe') || 14);
const NS = 'http://www.w3.org/2000/svg', sv = document.getElementById('sv');
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); (p || sv).appendChild(e); return e; };
let W, H, S, OX, OY;
const map = (x, y) => [OX + x*S, OY + y*S];
const px = au => IMG.sunX + au*IMG.au;
function size(){ W = innerWidth; H = innerHeight; S = Math.max(W/IMG.w, H/IMG.h); OX = (W - IMG.w*S)/2; OY = (H - IMG.h*S)/2; sv.setAttribute('viewBox', `0 0 ${W} ${H}`); }
addEventListener('resize', () => { size(); drawScene(); layout(); }); size();
/* the scene itself: every orbit is a circle centred on the Sun that passes exactly through its planet */
const scene = el('g', {});
sv.insertBefore(scene, sv.firstChild);
const defs = el('defs', {}); sv.insertBefore(defs, sv.firstChild);
defs.innerHTML = '<radialGradient id="sunH"><stop offset="0" stop-color="rgba(255,236,190,.95)"/><stop offset=".12" stop-color="rgba(255,214,140,.55)"/><stop offset=".45" stop-color="rgba(255,170,80,.12)"/><stop offset="1" stop-color="rgba(255,150,60,0)"/></radialGradient>'
  + '<radialGradient id="glw"><stop offset="0" stop-color="rgba(255,255,255,.35)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></radialGradient>';
const STARS = Array.from({length:120}, () => [Math.random(), Math.random(), Math.random()*1.1+.3, Math.random()*.5+.15]);
const BELT = Array.from({length:520}, () => [2.15 + Math.random()*1.15, Math.random()*6.283, Math.random()*1+.4, Math.random()*.45+.15]);
function drawScene(){
  scene.innerHTML = '';
  STARS.forEach(([x, y, r, a]) => el('circle', {cx:x*W, cy:y*H, r, fill:'#dfe7ff', opacity:a}, scene));
  const [sx, sy] = map(IMG.sunX, IMG.y);
  BELT.forEach(([au, t, r, a]) => el('circle', {cx:sx + au*IMG.au*S*Math.cos(t), cy:sy + au*IMG.au*S*Math.sin(t), r:r*Math.max(.7,S), fill:'#d9cdb4', opacity:a}, scene));
  P.forEach(p => el('circle', {cx:sx, cy:sy, r:p.au*IMG.au*S, fill:'none', stroke: p.au === 1 ? 'rgba(110,160,230,.45)' : 'rgba(175,190,215,.30)', 'stroke-width':1.2}, scene));
  el('circle', {cx:sx, cy:sy, r:150*S, fill:'url(#sunH)'}, scene);
  el('circle', {cx:sx, cy:sy, r:15*S, fill:'#fff3d6'}, scene);
  P.forEach(p => { const x = sx + p.au*IMG.au*S, r = p.r*S;
    el('circle', {cx:x, cy:sy, r:r*2.4, fill:'url(#glw)'}, scene);
    if (p.ring) el('ellipse', {cx:x, cy:sy, rx:r*2.3, ry:r*.62, fill:'none', stroke:'#e9dcb6', 'stroke-width':1.6*S+.4, opacity:.9}, scene);
    el('circle', {cx:x, cy:sy, r, fill:p.c}, scene);
    if (p.ring) el('path', {d:`M ${x - r*2.3} ${sy} A ${r*2.3} ${r*.62} 0 0 0 ${x + r*2.3} ${sy}`, fill:'none', stroke:'#e9dcb6', 'stroke-width':1.6*S+.4}, scene); });
}
drawScene();

/* hover: the nearest planet along the line shows its name and distance */
const hov = document.getElementById('hov'), ring = el('circle', {r:0, fill:'none', stroke:'#ffe2a6', 'stroke-width':2, opacity:0});
function showTip(tip, i, lift){
  const [x, y] = map(px(P[i].au), IMG.y);
  tip.querySelector('b').textContent = P[i].n; tip.querySelector('.a').textContent = fmt(P[i].au);
  const b = tip.querySelector('.b'); if (b) b.textContent = P[i].km;
  const hw = tip.offsetWidth/2 + 14; tip.style.left = Math.min(W - hw, Math.max(hw, x)) + 'px'; tip.style.top = (y - lift*S) + 'px'; tip.classList.add('on');
}
addEventListener('mousemove', e => {
  const [, y] = map(0, IMG.y); let best = -1, bd = 1e9;
  if (Math.abs(e.clientY - y) < 60*S) P.forEach((p,i) => { const d = Math.abs(e.clientX - map(px(p.au), 0)[0]); if (d < bd){ bd = d; best = i; } });
  if (best >= 0 && bd < 40*S){ showTip(hov, best, 34); const [x] = map(px(P[best].au), 0);
    ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('r', (P[best].r*(P[best].ring ? 2.6 : 1.6) + 4)*S); ring.setAttribute('opacity', .9); document.body.style.cursor = 'pointer'; }
  else { hov.classList.remove('on'); ring.setAttribute('opacity', 0); document.body.style.cursor = ''; }
});
addEventListener('mouseleave', () => { hov.classList.remove('on'); ring.setAttribute('opacity', 0); });

/* step 2: a measuring tape runs out from the Sun and stops at each planet with its distance,
   then a probe (Voyager 2, launched 1977) travels out and shows the year it passed each giant planet */
const tape = el('line', {stroke:'#d8b46a', 'stroke-width':2.5, 'stroke-linecap':'round', opacity:0});
const ticks = el('g', {}), ptr = el('path', {fill:'#ffe2a6', opacity:0});
const read = document.getElementById('read'), yr = document.getElementById('yr');
const probe = el('g', {opacity:0});
el('circle', {r:16, fill:'rgba(255,226,166,.18)'}, probe);
el('rect', {x:-5, y:-4, width:10, height:8, rx:1.5, fill:'none', stroke:'#f1e3c2', 'stroke-width':1.6}, probe);
el('path', {d:'M -3 -4 Q 0 -13 3 -4', fill:'none', stroke:'#f1e3c2', 'stroke-width':1.6}, probe);
el('line', {x1:5, y1:0, x2:13, y2:6, stroke:'#f1e3c2', 'stroke-width':1.3}, probe);
const trail = el('line', {stroke:'rgba(241,227,194,.55)', 'stroke-width':1.5, 'stroke-dasharray':'2 6', opacity:0});
let tapeAU = 0, started = false, probeAU = null, yearTxt = '';
function layout(){
  const y = map(0, IMG.y + 48)[1], x0 = map(IMG.sunX, 0)[0];
  tape.setAttribute('x1', x0); tape.setAttribute('y1', y); tape.setAttribute('x2', map(px(tapeAU), 0)[0]); tape.setAttribute('y2', y);
  [...ticks.children].forEach((t, i) => { const x = map(px(P[i].au), 0)[0]; t.setAttribute('x1', x); t.setAttribute('x2', x); t.setAttribute('y1', y - 7); t.setAttribute('y2', y + 7); });
  const xp = map(px(tapeAU), 0)[0]; ptr.setAttribute('d', `M ${xp} ${y-9} l -7 -12 l 14 0 z`);
  if (probeAU !== null){ const [qx, qy] = map(px(probeAU), IMG.y - 70); probe.setAttribute('transform', `translate(${qx} ${qy}) scale(${Math.max(1.1, S*1.6)})`);
    const [ex] = map(px(1), 0); trail.setAttribute('x1', ex); trail.setAttribute('x2', qx); trail.setAttribute('y1', qy); trail.setAttribute('y2', qy);
    { const hw = yr.offsetWidth/2 + 14; yr.style.left = Math.min(W - hw, Math.max(hw, qx)) + 'px'; } yr.style.top = (qy - 28*S) + 'px'; }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function glide(a, b, ms, onStep){ return new Promise(res => { const t0 = performance.now();
  (function f(t){ const k = Math.min(1, (t - t0)/ms), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2; onStep(a + (b - a)*e); if (k < 1) requestAnimationFrame(f); else res(); })(t0); }); }
async function runTape(){
  tape.setAttribute('opacity', .95); ptr.setAttribute('opacity', 1);
  let last = 0;
  for (let i = 0; i < P.length; i++){
    const to = P[i].au, ms = i < 4 ? 650 : 700 + (to - last)*55;
    read.classList.remove('on');
    await glide(last, to, ms, v => { tapeAU = v; layout(); });
    el('line', {stroke:'#d8b46a', 'stroke-width':2}, ticks); layout();
    showTip(read, i, 92); last = to;
    await sleep(i < 4 ? 900 : 1300);
  }
  await sleep(1200); read.classList.remove('on');
}
async function runProbe(){
  // Voyager 2 (launched 1977): years after launch when it passed each giant planet
  const legs = [[1, 0], [5.2, 1.9], [9.54, 4], [19.2, 8.4], [30.1, 12]];
  const names = ['', 'צדק', 'שבתאי', 'אורנוס', 'נפטון'];
  const show = (y, sub) => { const n = y === 0 ? '0' : (Number.isInteger(y) ? String(y) : y.toFixed(1).replace('.0', ''));
    yr.innerHTML = `${n}<small>${sub}</small>`; layout(); };
  probeAU = 1; layout(); probe.animate([{opacity:0},{opacity:1}], {duration:600, fill:'forwards'}); trail.setAttribute('opacity', 1);
  show(0, 'שנים בדרך · יוצאים לדרך'); yr.style.opacity = 1; layout();
  await sleep(1600);
  for (let k = 1; k < legs.length; k++){
    const [a, ya] = legs[k-1], [b, yb] = legs[k];
    await glide(a, b, 900 + (yb - ya)*650, v => { probeAU = v; show(Math.floor(ya + (yb - ya)*(v - a)/(b - a)), 'שנים בדרך'); layout(); });
    show(Math.round(yb), `שנים בדרך · ליד ${names[k]}`); await sleep(1000);
  }
  show(12, 'שנים בדרך עד נפטון');
}
async function start(){
  if (started) return; started = true;
  const t0 = performance.now();
  await runTape();
  const wait = PROBE_AT*1000 - (performance.now() - t0); if (wait > 0) await sleep(wait);
  runProbe();
}
addEventListener('message', e => { if (e.data && e.data.type === 'step' && e.data.n >= 1) start(); });
if (new URLSearchParams(location.search).get('auto')) start();   // for previewing the page on its own
layout();
</script></body></html>
