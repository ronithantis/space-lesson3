  const q = pos(p.r, th), depth = 1 - .12 * Math.sin(th), s = A * 2 * p.s * depth * (p.k === 'saturn' ? 2.1 : 1);

  const w = s, h = s * im.height / im.width;
  cx.drawImage(im, q.x - w/2, q.y - h/2, w, h);
}
function frame(now){
  const t = (now - start) / 1000;
  cx.clearRect(0,0,W,H);
  stars.forEach(s => { cx.fillStyle = `rgba(220,230,255,${s.a})`; cx.beginPath(); cx.arc(s.x*W, s.y*H, s.r, 0, 6.283); cx.fill(); });
  // orbits
  PL.forEach(p => { cx.beginPath(); cx.ellipse(W/2, H*CY, A*p.r, A*p.r*TILT, 0, 0, 6.283);
    cx.strokeStyle = 'rgba(150,200,255,.30)'; cx.lineWidth = 1.4; cx.shadowColor = 'rgba(120,180,255,.6)'; cx.shadowBlur = 6; cx.stroke(); cx.shadowBlur = 0; });
  const th = PL.map((p,i) => phase[i] + 6.283 * t / (YEAR * p.T));
  const bt = belt.map(b => b.a + 6.283 * t / (YEAR * 4.6));
  // back half: belt + planets behind the sun
  cx.fillStyle = 'rgba(205,195,175,.55)';
  belt.forEach((b,i) => { if (Math.sin(bt[i]) > 0){ const q = pos(b.r, bt[i]); cx.fillRect(q.x, q.y, b.z, b.z); } });
  PL.forEach((p,i) => { if (Math.sin(th[i]) > 0) drawPlanet(p, th[i]); });
  // sun
  const sr = A * .075, g = cx.createRadialGradient(W/2, H*CY, sr*.6, W/2, H*CY, sr*2.6);
  g.addColorStop(0,'rgba(255,200,110,.55)'); g.addColorStop(1,'rgba(255,150,60,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(W/2, H*CY, sr*2.6, 0, 6.283); cx.fill();
  if (img.sun.complete) cx.drawImage(img.sun, W/2 - sr, H*CY - sr, sr*2, sr*2);
  // front half
  cx.fillStyle = 'rgba(205,195,175,.55)';
  belt.forEach((b,i) => { if (Math.sin(bt[i]) <= 0){ const q = pos(b.r, bt[i]); cx.fillRect(q.x, q.y, b.z, b.z); } });
  PL.forEach((p,i) => { if (Math.sin(th[i]) <= 0) drawPlanet(p, th[i]); });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
