<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מי הלוויין?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02040a; --ink:#ffffff; --soft:#c9d3e2; --muted:#93a0b6; --gold:#d8b46a; --miss:#e8917e;
  --glass:rgba(6,12,26,.6); --line:rgba(190,210,240,.16);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#02040a; } }
:root[data-theme="dark"]{ --bg:#02040a; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; min-height:100%; background:radial-gradient(120% 80% at 50% 0%, #0a1426 0%, var(--bg) 60%); color:var(--ink); font-family:"Heebo",system-ui,"Segoe UI",Arial,sans-serif; font-weight:400; line-height:1.5; -webkit-font-smoothing:antialiased; }
.wrap{ width:min(1400px,100%); margin:0 auto; padding:clamp(12px,2vh,22px) clamp(12px,2.5vw,28px) 16px; display:flex; flex-direction:column; gap:clamp(8px,1.4vh,14px); }

header{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
h1{ margin:0; font-weight:700; font-size:clamp(1.5rem,3vw,2.2rem); line-height:1.15; }
.instr{ margin:2px 0 0; color:var(--soft); font-size:clamp(.95rem,1.6vw,1.08rem); }
.hside{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.count{ font-weight:700; font-size:clamp(1.2rem,2.2vw,1.5rem); color:var(--gold); font-variant-numeric:tabular-nums; direction:ltr; min-width:3.4em; text-align:center; }
.tbtn{ font:inherit; font-weight:500; font-size:.92rem; color:var(--soft); background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
.tbtn:hover{ color:var(--ink); border-color:rgba(216,180,106,.5); }

.stage{ position:relative; width:min(100%, calc((100vh - 230px) * 16 / 9)); min-width:min(100%, 320px); aspect-ratio:16/9; margin:0 auto; border-radius:14px; overflow:hidden; background:#000 center/cover no-repeat; border:1px solid var(--line); box-shadow:0 30px 80px rgba(0,0,0,.55); touch-action:none; user-select:none; -webkit-user-select:none; }
.stage .shade{ position:absolute; inset:0; background:radial-gradient(130% 100% at 50% 50%, transparent 60%, rgba(0,0,0,.35) 100%); pointer-events:none; }
.dot{
  position:absolute; width:clamp(18px,2.1vw,30px); height:clamp(18px,2.1vw,30px); transform:translate(-50%,-50%);
  border-radius:50%; border:2px solid transparent; background:transparent;
  padding:0; cursor:pointer; transition:background-color .25s, border-color .25s;
}
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,.35); } 50%{ box-shadow:0 0 0 9px rgba(255,255,255,0); } }
.dot.armed:focus-visible{ border-color:#fff; background:rgba(255,255,255,.22); }
.ping{ position:absolute; width:clamp(26px,3vw,40px); height:clamp(26px,3vw,40px); transform:translate(-50%,-50%); border-radius:50%; border:2px solid var(--miss); background:rgba(232,145,126,.25); pointer-events:none; animation:ping .8s ease-out forwards; }
@keyframes ping{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.5); } 25%{ opacity:1; transform:translate(-50%,-50%) scale(1); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1.4); } }
.dot.ok{ width:clamp(9px,.9vw,13px); height:clamp(9px,.9vw,13px); border:1px solid #fff3d6; background:var(--gold); animation:none; box-shadow:0 0 10px 2px rgba(216,180,106,.65); cursor:default; }
.dot.miss{ animation:miss .7s ease; }
@keyframes miss{ 0%,100%{ border-color:transparent; background:transparent; } 30%,60%{ border-color:var(--miss); background:rgba(232,145,126,.55); box-shadow:0 0 0 6px rgba(232,145,126,.25); } }
.dot.hint{ animation:hint 1.4s ease; }
@keyframes hint{ 0%,100%{ box-shadow:0 0 0 0 rgba(216,180,106,0); } 25%,75%{ border-color:var(--gold); background:rgba(216,180,106,.5); box-shadow:0 0 0 12px rgba(216,180,106,.25); } }
.dot:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

.lab{ position:absolute; transform:translate(-50%,calc(-100% - 12px)); display:flex; flex-direction:column; align-items:center; pointer-events:none; animation:lab .45s ease both; }
.lab span{ white-space:nowrap; font-weight:500; font-size:clamp(.7rem,1.05vw,.92rem); color:var(--gold); background:rgba(6,12,26,.78); border:1px solid rgba(216,180,106,.6); border-radius:999px; padding:2px 10px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
.lab i{ width:1px; height:clamp(8px,1.3vw,16px); background:var(--gold); opacity:.8; }
.lab.down{ transform:translate(-50%,12px); flex-direction:column-reverse; }
@keyframes lab{ from{ opacity:0; } to{ opacity:1; } }

.note{ position:absolute; color:rgba(220,228,240,.78); font-size:clamp(.62rem,.95vw,.82rem); line-height:1.35; text-shadow:0 1px 6px #000; pointer-events:none; }
.note.scale{ bottom:2.2%; left:2%; max-width:46%; text-align:left; direction:rtl; }
.note.webb{ top:24%; left:94%; transform:translateX(-50%); white-space:nowrap; }

.status{ min-height:1.5em; margin:0; text-align:center; font-size:1rem; color:var(--soft); }
.status.err{ color:var(--miss); }
.status.ok{ color:var(--gold); }

.tray{ display:flex; flex-wrap:wrap; gap:clamp(6px,1vw,12px); justify-content:center; min-height:48px; }
.card{
  font:inherit; font-weight:500; font-size:clamp(.92rem,1.4vw,1.05rem); color:var(--ink);
  background:var(--glass); border:1px solid var(--line); border-radius:10px; padding:10px 18px;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); cursor:grab; touch-action:none; user-select:none;
  transition:border-color .2s, background-color .2s, opacity .2s, transform .15s;
}
.card:hover{ border-color:rgba(216,180,106,.55); transform:translateY(-2px); }
.card.sel{ border-color:var(--gold); background:rgba(216,180,106,.14); color:var(--gold); }
.card.lifting{ opacity:.25; }
.card:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
.ghost{ position:fixed; left:0; top:0; z-index:50; pointer-events:none; cursor:grabbing; margin:0; border-color:var(--gold); box-shadow:0 18px 40px rgba(0,0,0,.5); }
.ghost.back{ transition:transform .32s cubic-bezier(.3,.7,.3,1), opacity .32s; }

.overlay{ position:fixed; inset:0; z-index:60; background:rgba(1,4,12,.55); display:flex; align-items:center; justify-content:center; padding:18px; }
.overlay[hidden]{ display:none; }
.pop{ width:min(460px,100%); background:rgba(6,12,26,.86); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:18px; padding:clamp(20px,3.5vw,30px); box-shadow:0 40px 90px rgba(0,0,0,.6); animation:pop .32s cubic-bezier(.2,.7,.2,1) both; }
.pop.wide{ width:min(560px,100%); }
@keyframes pop{ from{ opacity:0; transform:translateY(10px) scale(.98); } to{ opacity:1; transform:none; } }
.pop h2{ margin:0 0 4px; font-weight:700; font-size:clamp(1.5rem,3.4vw,2rem); line-height:1.2; }
.pop .type{ margin:0 0 12px; color:var(--gold); font-weight:500; }
.pop p.txt{ margin:0 0 22px; color:var(--soft); font-size:1.05rem; line-height:1.65; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.btn{ font:inherit; font-weight:500; font-size:1rem; padding:10px 26px; border-radius:999px; cursor:pointer; border:1px solid var(--gold); background:var(--gold); color:#1b1407; }
.btn:hover{ background:#e4c27c; }
.btn.ghostbtn{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn.ghostbtn:hover{ border-color:var(--gold); }
.btn:focus-visible, .tbtn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

@media (prefers-reduced-motion: reduce){ *, *::before, *::after{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="tTitle"></h1>
      <p class="instr" id="tInstr"></p>
    </div>
    <div class="hside">
      <button class="tbtn" id="sound" type="button"></button>
      <button class="tbtn" id="restart" type="button"></button>
      <span class="count" id="count" aria-live="polite">0 / 7</span>
    </div>
  </header>

  <div class="stage" id="stage" role="group" aria-label="תמונת הלוויינים">
    <div class="shade"></div>
    <div id="labels"></div>
    <div id="dots"></div>
    <p class="note webb" id="tWebbDist"></p>
    <p class="note scale" id="tScale"></p>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
  <div class="tray" id="tray" role="list"></div>
</div>

<div class="overlay" id="info" hidden>
  <div class="pop" role="dialog" aria-modal="true" aria-labelledby="iName">
    <h2 id="iName"></h2>
    <p class="type" id="iType"></p>
    <p class="txt" id="iText"></p>
    <button class="btn" id="iClose" type="button"></button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="pop wide" role="dialog" aria-modal="true" aria-labelledby="eTitle">
    <h2 id="eTitle"></h2>
    <p class="txt" id="eText"></p>
    <div class="row">
      <button class="btn" id="eView" type="button"></button>
      <button class="btn ghostbtn" id="eAgain" type="button"></button>
    </div>
  </div>
</div>

  order.forEach(i => {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'card'; c.dataset.s = i; c.setAttribute('role','listitem');
    c.textContent = tx(SATS[i].name);
    c.addEventListener('pointerdown', onDown);
    c.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleSelect(i, true); }
      if (e.key === 'Escape') unselect(true);
    });
    tray.appendChild(c);
  });
  setStatus(''); updateCount();
  $('end').hidden = true; $('info').hidden = true;
}
function updateCount(){ $('count').textContent = `${placed.size} / ${SATS.length}`; }
function setStatus(msg, cls){ const s = $('status'); s.textContent = msg; s.className = 'status' + (cls ? ' ' + cls : ''); }
function cardEl(i){ return $('tray').querySelector(`.card[data-s="${i}"]`); }

function toggleSelect(i, kb){
  if (selected === i){ unselect(false); return; }
  selected = i;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', +c.dataset.s === i));
  dotEls.forEach(d => { const free = !d.el.classList.contains('ok'); d.el.tabIndex = free ? 0 : -1; d.el.classList.toggle('armed', free); });
  setStatus(t('picked'));
  if (kb){ const first = dotEls.find(d => !d.el.classList.contains('ok')); if (first) first.el.focus(); }
}
function unselect(refocus){
  const prev = selected; selected = null;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('sel'));
  dotEls.forEach(d => { d.el.tabIndex = -1; d.el.classList.remove('armed'); });
  if (refocus && prev !== null){ const c = cardEl(prev); if (c) c.focus(); }
}

/* drag */
function onDown(e){
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const card = e.currentTarget;
  drag = { card, s:+card.dataset.s, x0:e.clientX, y0:e.clientY, moved:false, near:null };
  addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp, { once:true });
  addEventListener('pointercancel', onCancel, { once:true });
}
function stagePct(cx, cy){
  const r = $('stage').getBoundingClientRect();
  if (cx < r.left || cx > r.right || cy < r.top || cy > r.bottom) return null;
  return { x:(cx - r.left) / r.width * 100, y:(cy - r.top) / r.height * 100 };
}
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, (ay - by) * 9 / 16);
function nearestDot(p){
  let best = null, bd = Infinity;
  dotEls.forEach(d => { if (d.el.classList.contains('ok')) return; const dd = dist(p.x, p.y, d.x, d.y); if (dd < bd){ bd = dd; best = d; } });
  return bd <= RADIUS ? best : null;
}
function onMove(e){
  if (!drag) return;
  if (!drag.moved){
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.moved = true; unselect(false);
    const r = drag.card.getBoundingClientRect();
    const g = drag.card.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
    g.style.width = r.width + 'px';
    drag.ox = drag.x0 - r.left; drag.oy = drag.y0 - r.top; drag.home = r;
    document.body.appendChild(g); drag.ghost = g; drag.card.classList.add('lifting');
  }
  drag.ghost.style.transform = `translate(${e.clientX - drag.ox}px, ${e.clientY - drag.oy}px)`;
  const p = stagePct(e.clientX, e.clientY);
  const n = p ? nearestDot(p) : null;
  drag.near = n;
}
function onUp(e){
  removeEventListener('pointermove', onMove); removeEventListener('pointercancel', onCancel);
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved){ toggleSelect(d.s, false); return; }
  const p = stagePct(e.clientX, e.clientY);
  if (p && attempt(d.s, p.x, p.y, null, true)){ d.ghost.remove(); return; }
  sendBack(d);
}
function onCancel(){
  removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp);
  if (drag && drag.moved) sendBack(drag); drag = null;
}
function sendBack(d){
  const g = d.ghost, h = d.card.getBoundingClientRect();
  if (reduce){ g.remove(); d.card.classList.remove('lifting'); return; }
  g.classList.add('back');
  requestAnimationFrame(() => { g.style.transform = `translate(${h.left}px, ${h.top}px)`; });
  setTimeout(() => { g.remove(); d.card.classList.remove('lifting'); }, 340);
}

/* placement */
function attempt(si, x, y, dotEl, fromDrag){
  const s = SATS[si];
  let hit = -1, bd = Infinity;
  s.pts.forEach(([px,py],k) => { const dd = dist(x, y, px, py); if (dd <= RADIUS && dd < bd){ bd = dd; hit = k; } });
  if (dotEl && +dotEl.dataset.s !== si) hit = -1;
  if (hit > -1){ success(si, hit); return true; }
  // wrong
  misses[si] = (misses[si] || 0) + 1;
  if (dotEl) flash(dotEl, 'miss');
  else { const pg = document.createElement('div'); pg.className = 'ping'; pg.style.left = x + '%'; pg.style.top = y + '%'; $('labels').appendChild(pg); setTimeout(() => pg.remove(), 850); }
  setStatus(t('wrong'), 'err');
  if (misses[si] >= 2) setTimeout(() => dotEls.filter(d => d.s === si).forEach(d => flash(d.el, 'hint')), 450);
  if (!fromDrag){ const c = cardEl(si); if (c) c.animate && !reduce && c.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:300}); }
  return false;
}
function flash(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 1500); }

function success(si, k){
  const s = SATS[si];
  placed.add(si);
  unselect(false);
  dotEls.filter(d => d.s === si).forEach(d => { d.el.classList.remove('armed','miss','hint','near'); d.el.classList.add('ok'); d.el.disabled = true; d.el.setAttribute('aria-label', tx(s.name)); });
  const [x,y] = s.pts[k];
  const lab = document.createElement('div');
  lab.className = 'lab' + (y < 22 ? ' down' : '');
  lab.style.left = x + '%'; lab.style.top = y + '%';
  lab.innerHTML = '<span></span><i></i>'; lab.firstChild.textContent = tx(s.name);
  $('labels').appendChild(lab);
  const c = cardEl(si); if (c) c.remove();
  updateCount(); setStatus('');
  chime();
  $('iName').textContent = tx(s.name); $('iType').textContent = tx(s.type); $('iText').textContent = tx(s.text);
  $('info').hidden = false; $('iClose').focus();
}
function closeInfo(){
  $('info').hidden = true;
  if (placed.size === SATS.length){ $('end').hidden = false; $('eView').focus(); return; }
  const first = $('tray').querySelector('.card'); if (first) first.focus({preventScroll:true});
}

/* sound */
function chime(){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const now = actx.currentTime;
    [[660,0],[990,.09]].forEach(([f,d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + d); g.gain.linearRampToValueAtTime(.12, now + d + .02); g.gain.exponentialRampToValueAtTime(.001, now + d + .6);
      o.connect(g); g.connect(actx.destination); o.start(now + d); o.stop(now + d + .65);
    });
  } catch(e){}
}

$('stage').addEventListener('click', e => {
  if (selected === null || e.target.closest('.dot')) return;
  const p = stagePct(e.clientX, e.clientY); if (p) attempt(selected, p.x, p.y, null, false);
});
$('iClose').addEventListener('click', closeInfo);
$('info').addEventListener('click', e => { if (e.target === $('info')) closeInfo(); });
$('eView').addEventListener('click', () => { $('end').hidden = true; });
$('eAgain').addEventListener('click', reset);
$('restart').addEventListener('click', reset);
$('sound').addEventListener('click', () => { soundOn = !soundOn; soundLabel(); });
addEventListener('keydown', e => {
  if (!$('info').hidden && (e.key === 'Enter' || e.key === 'Escape')){ e.preventDefault(); closeInfo(); }
  else if (!$('end').hidden && e.key === 'Escape'){ $('end').hidden = true; }
});

soundLabel(); reset();
</script>
</body>
</html>
