<title>סיור בכוכבי הלכת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:Heebo,system-ui,sans-serif;color:#eef2f8}
#st{position:fixed;inset:0;width:100%;height:100%}
.o{position:fixed;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity}

.ic{width:120px;height:120px;margin:-60px 0 0 -60px;opacity:0;transition:opacity .6s,transform .6s}
.ic img{width:100%;height:100%;object-fit:contain;display:block;filter:brightness(.8)}
.ic b{position:absolute;top:118%;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:500;font-size:24px;color:#cfd8e8;text-shadow:0 0 8px #000}
.ic.sat b{font-size:17.8px;top:97%}
.ic.on img{filter:none}.ic.on b{color:#ffe2a6;font-weight:700}
.ic.on:before{content:"";position:absolute;inset:-14%;border:2px solid #ffe2a6;border-radius:50%;box-shadow:0 0 18px rgba(255,226,166,.6)}
.ic.sat.on:before{inset:2% -6%}
#arrow{width:0;height:0;margin:-14px 0 0 -14px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:20px solid #ffe2a6;opacity:0;transition:transform .6s,opacity .4s}
#sunE{width:360px;height:360px;margin:-180px 0 0 -180px}
#sunE img{width:100%;height:100%;border-radius:50%}
#sunE:before{content:"";position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,200,100,.5),rgba(255,150,50,0) 65%)}
#big{width:560px;height:560px;margin:-280px 0 0 -280px;opacity:0;transition:transform 1s cubic-bezier(.3,.1,.2,1),opacity .7s}
#big img{width:100%;height:100%;object-fit:contain;display:block}
#big:before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(160,190,255,.16),rgba(160,190,255,0) 66%)}
#line{position:fixed;height:1px;background:linear-gradient(90deg,rgba(216,180,106,.0),rgba(216,180,106,.55) 10%,rgba(216,180,106,.55) 90%,rgba(216,180,106,0));opacity:.9}

<script>
/* layout works in a 1920x1080 frame scaled to cover the window, like the backgrounds */
let W,H,S,OX,OY;
function size(){W=innerWidth;H=innerHeight;S=Math.max(W/1920,H/1080);OX=(W-1920*S)/2;OY=(H-1080*S)/2;}
const cv=document.getElementById('st'),cx=cv.getContext('2d');
const STARS=Array.from({length:170},()=>[Math.random(),Math.random(),Math.random()*1.2+.3,Math.random()*.55+.15,Math.random()*6.28]);
let twinkle=0;

const P=(x,y)=>[OX+x*S,OY+y*S];
function place(el,x,y,sc,op){const [a,b]=P(x,y);el.style.transform=`translate(${a}px,${b}px) scale(${sc*S})`;if(op!=null)el.style.opacity=op;}
function layout(){size();
  const [a,b]=P(60,ICON_Y),[c]=P(1860,ICON_Y);line.style.left=a+'px';line.style.top=b+'px';line.style.width=(c-a)+'px';
  place(sunE,-40,ICON_Y,1,1);
  icons.forEach((d,i)=>{place(d,ICON_X[i],ICON_Y,(i===5?1.35:1)*(step>0&&i===step-1?1.15:1),1);d.classList.toggle('on',step>0&&i===step-1);});
  if(step>0){const i=step-1;place(arrow,ICON_X[i],ICON_Y-92,1,1);
    if(shown!==i){shown=i;bigImg.src=PL[i].b;place(big,ICON_X[i],ICON_Y,.2,0);big.getBoundingClientRect();}
    place(big,520,370,i===5?1.3:1,1);}
  else{arrow.style.opacity=0;big.style.opacity=0;shown=-1;}}
function frame(t){stars(t);requestAnimationFrame(frame);}
addEventListener('resize',layout);
addEventListener('message',e=>{if(e.data&&e.data.type==='step'){step=Math.max(0,Math.min(8,+e.data.n||0));layout();}});
layout();requestAnimationFrame(frame);

</script></body></html>
