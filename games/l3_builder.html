<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בונים את מערכת השמש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* ===================== DATA: כל הטקסטים במקום אחד ===================== */
const DATA = {
  title: 'בונים את מערכת השמש',
  instr: 'קראו את הרמז, זהו את כוכב הלכת וגררו אותו למסלול שלו.',
  anchor: 'earth',            /* כוכב לכת שמוצב מראש כרמז. null = בלי עוגן */
  optionsDelay: 2200,         /* כמה זמן (מ"ש) מופיע הרמז לבד לפני האפשרויות */
  notScale: 'תרשים סכמטי: המרחקים והגדלים אינם בקנה מידה, והמסלולים אינם מעגלים מושלמים.',
  belt: 'חגורת האסטרואידים',
  sunNote: ['בתרשים רואים רק חלק מהשמש.', ''],
  sun: 'השמש',
  who: 'מי אני?',
  pick: 'בחרו את כוכב הלכת:',
  dragNow: name => `נכון! עכשיו גררו את ${name} למסלול שלו.`,
  wrongPick: 'לא זה. הנה רמז נוסף:',
  wrongOrbit: (name, n) => `זיהיתם נכון: זה ${name}. אבל הנחתם אותו במסלול ה${ORD[n]} מהשמש. ספרו שוב מהשמש החוצה.`,
  orbitHint: 'המסלול הנכון מהבהב לרגע.',
  next: 'לכוכב הלכת הבא',
  finish: 'לסיכום',
  bonus: '+1 בונוס להסבר',
  bonusGiven: 'נוספה נקודת בונוס',
  round: (n, t) => `סבב ${n} מתוך ${t}`,
  score: (s, t) => `ניקוד: ${s} / ${t}`,
  teams: 'שתי קבוצות',
  oneTeam: 'משחק רגיל',
  teamA: 'קבוצה א', teamB: 'קבוצה ב',
  turn: t => `התור של ${t}`,
  restart: 'התחלה מחדש',
  anchorNote: 'כדור הארץ כבר במקומו, כרמז. היעזרו בו כדי לספור מסלולים.',
  orbitBtn: n => `המסלול ה${ORD[n]} מהשמש`,
  endTitle: 'מערכת השמש שלנו',
  endText: 'קרוב לשמש נמצאים כוכבי הלכת הסלעיים: קטנים, עם פני שטח מוצקים. אחרי חגורת האסטרואידים באים ענקי הגזים, צדק ושבתאי, שעשויים בעיקר ממימן ומהליום. הכי רחוק נמצאים ענקי הקרח, אורנוס ונפטון, שיש בהם הרבה מים, אמוניה ומתאן.',
  pluto: 'ופלוטו? הוא אינו כוכב לכת. מאז 2006 הוא מוגדר ככוכב לכת ננסי.',
  groups: { rocky: 'כוכבי לכת סלעיים', gas: 'ענקי גזים', ice: 'ענקי קרח' },
  groupOne: { rocky: 'כוכב לכת סלעי', gas: 'ענק גזים', ice: 'ענק קרח' },
  endView: 'צפייה בתרשים',
  endAgain: 'משחק חוזר',
  endScore: (s, t) => `${s} נקודות מתוך ${t}`,
  planets: [
    { id: 'mercury', info: 'הוא כמעט בלי אטמוספרה, ופני השטח שלו מכוסים במכתשים.', name: 'כוכב חמה', group: 'rocky', sub: 'הקרוב ביותר לשמש',
      clue: 'אני כוכב הלכת הקטן ביותר במערכת השמש. אני עולם סלעי, ופני השטח שלי מכוסים במכתשי פגיעה. כמעט שאין לי אטמוספרה שתשמור על חום, ולכן יש אצלי הבדלי טמפרטורה קיצוניים בין היום ללילה.',
      hint: 'השנה שלי קצרה מאוד: אני משלים סיבוב סביב השמש ב-88 ימים בלבד.' },
    { id: 'venus', info: 'אפקט החממה הקיצוני הופך אותו לחם יותר אפילו מכוכב חמה, שקרוב יותר לשמש.', name: 'נוגה', group: 'rocky', sub: 'החם ביותר בפני השטח',
      clue: 'אני כוכב לכת סלעי שגודלו דומה לגודל כדור הארץ. האטמוספרה שלי צפופה מאוד ומורכבת בעיקר מפחמן דו־חמצני. אפקט חממה קיצוני כולא אצלי חום, ולכן פני השטח שלי חמים יותר מאלה של כל כוכב לכת אחר.',
      hint: 'בשמי הערב או הבוקר אני הנקודה הבהירה ביותר, אחרי הירח.' },
    { id: 'earth', info: 'העולם היחיד שבו ידועים לנו חיים.', name: 'כדור הארץ', group: 'rocky', sub: 'העולם המוכר לנו',
      clue: 'אני כוכב לכת סלעי שעל פני השטח שלו יש מים נוזליים בשפע. האטמוספרה שלי מכילה בעיקר חנקן וחמצן. אני העולם היחיד שבו ידועים לנו חיים, ויש לי ירח טבעי אחד.',
      hint: 'אתם נמצאים עליי ממש עכשיו.' },
    { id: 'mars', info: 'צבעו האדום נובע מברזל שעבר חמצון, ורוברים חוקרים בו סימנים לעבר.', name: 'מאדים', group: 'rocky', sub: 'כוכב הלכת האדום',
      clue: 'אני כוכב לכת סלעי, וצבעי האדמדם נובע ממינרלים המכילים ברזל שעבר חמצון. האטמוספרה שלי דלילה ומורכבת בעיקר מפחמן דו־חמצני. חוקרים שולחים אליי רוברים כדי לבדוק אם התקיימו בי בעבר תנאים מתאימים לחיים.',
      hint: 'אצלי נמצא הר הגעש הגבוה ביותר הידוע במערכת השמש: אולימפוס מונס.' },
    { id: 'jupiter', info: 'הוא כבד פי שניים וחצי מכל שאר כוכבי הלכת יחד.', name: 'צדק', group: 'gas', sub: 'הגדול ביותר',
      clue: 'אני כוכב הלכת הגדול ביותר במערכת השמש. אני ענק גזים, המורכב בעיקר ממימן ומהליום, ואין לי פני שטח מוצקים. באטמוספרה שלי משתוללות סופות עצומות, ובהן הכתם האדום הגדול.',
      hint: 'אחד הירחים שלי, גנימדס, גדול אפילו מכוכב חמה.' },
    { id: 'saturn', info: 'הטבעות שלו רחבות מאוד אבל דקות מאוד, ועשויות בעיקר מחלקיקי קרח.', name: 'שבתאי', group: 'gas', sub: 'מערכת טבעות מרהיבה',
      clue: 'אני ענק גזים, השני בגודלו במערכת השמש. אני מפורסם בטבעות הרחבות שלי, המורכבות בעיקר מחלקיקי קרח לצד סלע ואבק. בין הירחים שלי נמצאים טיטאן ואנקלדוס, שמעוררים עניין רב אצל חוקרי החלל.',
      hint: 'את הטבעות שלי אפשר לראות גם בטלסקופ קטן.' },
    { id: 'uranus', info: 'בגלל הציר הנטוי, כל עונה אצלו נמשכת בערך 21 שנים.', name: 'אורנוס', group: 'ice', sub: 'מסתובב כמעט על צדו',
      clue: 'אני ענק קרח בגוון כחול־ירקרק, שקשור למתאן שבאטמוספרה שלי. ציר הסיבוב שלי נטוי בכ-98 מעלות, ולכן אני מסתובב כמעט על צדי.',
      hint: 'בחלק מהשנה שלי, אחד הקטבים שלי פונה כמעט ישירות אל השמש.' },
    { id: 'neptune', info: 'הוא רחוק כל כך, שאור השמש מגיע אליו רק אחרי כ-4 שעות.', name: 'נפטון', group: 'ice', sub: 'הרחוק ביותר מהשמש',
      clue: 'אני ענק קרח, ואצלי נושבות הרוחות המהירות ביותר שנמדדו במערכת השמש: יותר מ-2,000 קמ"ש. גילו אותי בזכות חישובים מתמטיים, עוד לפני שמישהו ראה אותי בטלסקופ.',
      hint: 'שנה אחת שלי נמשכת כ-165 שנים של כדור הארץ.' }
  ]
};
const ORD = ['','ראשון','שני','שלישי','רביעי','חמישי','שישי','שביעי','שמיני'];
</script>
<style>
:root{
  --bg:#02040a; --ink:#e9eef6; --muted:#97a4ba; --gold:#d8b46a; --miss:#e8917e;
  --glass:rgba(8,15,30,.66); --line:rgba(190,210,240,.16);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#02040a; } }
:root[data-theme="dark"]{ --bg:#02040a; }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
html{ background:var(--bg); }
body{ background:var(--bg); color:var(--ink); font-family:"Heebo",system-ui,"Segoe UI",Arial,sans-serif; font-weight:400; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden; }
#stars{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.app{ position:relative; z-index:1; height:100vh; height:100dvh; display:grid; grid-template-rows:auto 1fr auto; padding:0 clamp(14px,2.2vw,30px) clamp(10px,1.8vh,16px); gap:clamp(4px,1vh,10px); }

header{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:clamp(8px,1.6vh,14px); }
h1{ margin:0; font-weight:700; font-size:clamp(1.25rem,3.2vh,1.8rem); line-height:1.15; }
.sub{ margin:2px 0 0; color:var(--muted); font-size:clamp(.92rem,2.2vh,1.05rem); }
.hside{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
.score{ font-weight:500; color:var(--gold); font-size:clamp(1rem,2.4vh,1.12rem); white-space:nowrap; }
.score .t{ color:var(--muted); font-weight:400; }
.score .t.on{ color:var(--gold); font-weight:500; }
.chip{ font:inherit; font-weight:500; font-size:.9rem; color:var(--muted); background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:5px 13px; cursor:pointer; white-space:nowrap; }
.chip:hover{ color:var(--ink); border-color:rgba(216,180,106,.5); }

/* ---------- Diagram ---------- */
.notes{ position:absolute; bottom:0; right:0; text-align:right; pointer-events:none; z-index:2; }
.notes p{ margin:0; line-height:1.4; text-shadow:0 1px 4px #000, 0 0 2px #000; }
.notes .n1{ font-size:clamp(.72rem,1.6vh,.84rem); color:rgba(200,210,228,.75); }
.notes .n2{ font-size:clamp(.76rem,1.7vh,.9rem); color:rgba(255,226,180,.92); white-space:nowrap; }
.stagewrap{ position:relative; min-height:0; display:flex; align-items:center; justify-content:flex-end; margin-inline-end:calc(-1 * clamp(14px,2.2vw,30px)); }
.diagram{ position:relative; width:min(100% + clamp(14px,2.2vw,30px), calc((100vh - 372px) * 3.125)); aspect-ratio:25/8; touch-action:none; user-select:none; -webkit-user-select:none; }
.diagram svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.ring{ fill:none; stroke:rgba(190,210,240,.2); stroke-width:1.2; transition:stroke .2s, stroke-width .2s; }
.ring.over{ stroke:var(--gold); stroke-width:2.4; }
.ring.hint{ animation:ringhint 1.6s ease; }
@keyframes ringhint{ 20%,70%{ stroke:var(--gold); stroke-width:3; } }
.ring.miss{ animation:ringmiss .8s ease; }
@keyframes ringmiss{ 25%,60%{ stroke:var(--miss); stroke-width:2.6; } }
.belt circle{ fill:rgba(200,190,170,.5); }
.plabel{ font-family:"Heebo",sans-serif; font-size:13px; font-weight:500; fill:var(--ink); text-anchor:middle; paint-order:stroke; stroke:rgba(2,4,10,.85); stroke-width:3px; }
.plabel.anchor{ fill:var(--gold); }
.sunnote{ font-family:"Heebo",sans-serif; font-size:12.5px; fill:rgba(255,226,180,.9); paint-order:stroke; stroke:rgba(2,4,10,.9); stroke-width:3px; }
.small{ font-family:"Heebo",sans-serif; font-size:11.5px; fill:rgba(200,210,228,.7); }
.slot{ position:absolute; width:clamp(26px,3.4vw,44px); height:clamp(26px,3.4vw,44px); transform:translate(-50%,-50%); border-radius:50%; border:0; background:transparent; padding:0; cursor:pointer; }
.slot:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.slot[disabled]{ cursor:default; pointer-events:none; }
.armed .slot:not([disabled]){ background:rgba(216,180,106,.08); }
.placed{ animation:land .5s cubic-bezier(.2,.7,.2,1) both; transform-box:fill-box; transform-origin:center; }
@keyframes land{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:none; } }

/* ---------- Panel ---------- */
.panel{ display:grid; grid-template-columns:minmax(320px, 1.1fr) minmax(300px, 1fr); gap:clamp(12px,2vw,24px); align-items:stretch; min-height:clamp(150px,27vh,200px); }
.card{ background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:14px; padding:clamp(12px,2vh,18px) clamp(14px,1.8vw,22px); display:flex; flex-direction:column; gap:6px; }
.card[hidden]{ display:none; }
.card .who{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.card .who b{ font-weight:700; color:var(--gold); font-size:1.05rem; }
.card .who span{ color:var(--muted); font-size:.92rem; }
.clue{ margin:0; font-size:clamp(1rem,2.5vh,1.12rem); line-height:1.55; }
.hint2{ margin:0; font-size:1rem; color:#cfd8e6; border-inline-start:2px solid var(--gold); padding-inline-start:10px; }
.hint2[hidden]{ display:none; }
.result h3{ margin:0; font-weight:700; font-size:clamp(1.2rem,3vh,1.45rem); }
.result .rs{ margin:0; color:var(--gold); font-weight:500; }
.result p{ margin:0; font-size:1rem; color:#d6deea; }
.rrow{ display:flex; gap:10px; margin-top:auto; padding-top:6px; flex-wrap:wrap; }

.choice{ display:flex; flex-direction:column; gap:8px; }
.choice .lbl{ margin:0; color:var(--muted); font-size:.95rem; min-height:1.4em; }
.choice .lbl.ok{ color:var(--gold); font-weight:500; }
.choice .lbl.err{ color:var(--miss); }
.opts{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; flex:1; }
.opts.wait .opt{ opacity:0; transform:translateY(6px); pointer-events:none; }
.opt{ font:inherit; color:var(--ink); background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:12px; padding:8px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; transition:opacity .4s, transform .4s, border-color .2s, background-color .2s; touch-action:none; }
.opt img{ width:clamp(44px,8vh,66px); height:clamp(44px,8vh,66px); object-fit:contain; pointer-events:none; -webkit-user-drag:none; }
.opt.wide img{ width:clamp(70px,13vh,108px); }
.opt span{ font-weight:500; font-size:1rem; }
.opt:hover:not(:disabled){ border-color:rgba(216,180,106,.55); }
.opt.no{ border-color:var(--miss); opacity:.5; cursor:default; }
.opt.yes{ border-color:var(--gold); background:rgba(216,180,106,.12); cursor:grab; }
.opt.yes.sel{ box-shadow:0 0 0 2px var(--gold); }
.opt.dim{ opacity:.25; pointer-events:none; }
.opt.lifting{ opacity:.25; }
.opt:focus-visible, .btn:focus-visible, .chip:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
.dragimg{ position:fixed; left:0; top:0; z-index:50; pointer-events:none; filter:drop-shadow(0 10px 24px rgba(0,0,0,.6)); }
.dragimg.back{ transition:transform .32s cubic-bezier(.3,.7,.3,1), opacity .32s; }

.btn{ font:inherit; font-weight:500; font-size:1rem; padding:8px 22px; border-radius:999px; cursor:pointer; border:1px solid var(--gold); background:var(--gold); color:#1b1407; white-space:nowrap; }
.btn:hover{ background:#e4c27c; }
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn.ghost:hover{ border-color:var(--gold); }
.btn:disabled{ opacity:.4; cursor:default; }

/* ---------- End ---------- */
.overlay{ position:fixed; inset:0; z-index:60; background:rgba(1,4,12,.66); display:flex; align-items:center; justify-content:center; padding:18px; }
.overlay[hidden]{ display:none; }
.pop{ width:min(980px,100%); max-height:100%; overflow:auto; background:rgba(8,15,30,.94); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:18px; padding:clamp(18px,3vh,30px) clamp(18px,3vw,34px); box-shadow:0 40px 90px rgba(0,0,0,.6); animation:pop .35s cubic-bezier(.2,.7,.2,1) both; }
@keyframes pop{ from{ opacity:0; transform:translateY(10px) scale(.98); } to{ opacity:1; transform:none; } }
.pop h2{ margin:0 0 2px; font-weight:700; font-size:clamp(1.5rem,4vh,2rem); }
.pop .es{ margin:0 0 14px; color:var(--gold); font-weight:500; font-size:1.1rem; }
.lineup{ display:flex; align-items:flex-end; gap:clamp(4px,1vw,12px); margin:6px 0 4px; direction:ltr; }
.lineup .grp{ direction:rtl; }
.lineup .gp{ flex-direction:row-reverse; }
.grp{ display:flex; flex-direction:column; gap:8px; flex:auto; }
.grp .gp{ display:flex; align-items:flex-end; justify-content:space-around; gap:6px; }
.grp .gp div{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.92rem; font-weight:500; }
.grp .gp img{ display:block; }
.grp .gt{ border-top:1px solid rgba(216,180,106,.5); padding-top:4px; text-align:center; color:var(--gold); font-size:.92rem; font-weight:500; }
.beltsep{ align-self:stretch; width:1px; background:repeating-linear-gradient(to bottom, rgba(200,190,170,.6) 0 3px, transparent 3px 7px); margin:0 4px; }
.pop p.et{ margin:14px 0 6px; color:#d6deea; font-size:1.02rem; line-height:1.6; }
.pop p.pl{ margin:0 0 18px; color:var(--muted); font-size:.98rem; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

@media (max-width:820px){
  body{ overflow:auto; }
  .app{ height:auto; min-height:100vh; }
  .diagram{ width:100%; }
  .panel{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div>
      <h1 id="hTitle"></h1>
      <p class="sub" id="hSub"></p>
    </div>
    <div class="hside">
      <span class="score" id="score" aria-live="polite"></span>
      <button class="chip" id="teamBtn" type="button"></button>
      <button class="chip" id="restart" type="button"></button>
    </div>
  </header>

  <div class="stagewrap">
    <div class="diagram" id="diagram">
      <svg id="svg" viewBox="0 0 1250 400" aria-hidden="true">
        <defs>
          <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#fffbe9"/>
            <stop offset=".35" stop-color="#ffe7a3"/>
            <stop offset=".7" stop-color="#ffb347"/>

const RADII = [262, 338, 418, 500, 712, 880, 1050, 1215];
const BELT = 606;
const DY = [-58, 62, -34, 52, -88, 74, -60, 40];
const SIZE = [16, 23, 24, 19, 50, 42, 32, 31];
function slotPos(i){ const r = RADII[i], dy = DY[i]; return { x: SUN.x + Math.sqrt(r*r - dy*dy), y: SUN.y + dy }; }

/* ---------- planet artwork (drawn in code) ---------- */
function rng(seed){ return () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }
const ART = {};
function sunArt(){
  const g = $('gSun'), R = SUN.r;
  g.innerHTML = `<circle cx="${SUN.x}" cy="${SUN.y}" r="${R*1.36}" fill="url(#glowG)"/>
    <image href="${PLANET_IMG.sun}" x="${SUN.x - R}" y="${SUN.y - R}" width="${R*2}" height="${R*2}"/>
    <circle cx="${SUN.x}" cy="${SUN.y}" r="${R}" fill="none" stroke="rgba(255,200,120,.35)" stroke-width="3"/>`;
  const t = document.createElementNS(NS,'text'); t.setAttribute('x', SUN.x + R - 58); t.setAttribute('y', SUN.y + 5); t.setAttribute('class','plabel'); t.textContent = DATA.sun; g.appendChild(t);
}

/* ---------- static scene ---------- */
function buildScene(){
  const g = $('gRings'); g.innerHTML = '';
  RADII.forEach((r,i) => { const c = document.createElementNS(NS,'circle'); c.setAttribute('cx',SUN.x); c.setAttribute('cy',SUN.y); c.setAttribute('r',r); c.setAttribute('class','ring'); c.dataset.i = i; g.appendChild(c); });
  const belt = document.createElementNS(NS,'g'); belt.setAttribute('class','belt');
  const rand = rng(4242);
  for (let i = 0; i < 230; i++){ const a = (rand()-.5)*.75, r = BELT + (rand()-.5)*30; const d = document.createElementNS(NS,'circle'); d.setAttribute('cx', SUN.x + Math.cos(a)*r); d.setAttribute('cy', SUN.y + Math.sin(a)*r); d.setAttribute('r', .6 + rand()*1.3); belt.appendChild(d); }
  g.appendChild(belt);
  const bl = document.createElementNS(NS,'text'); bl.setAttribute('class','small'); bl.setAttribute('x', SUN.x + BELT); bl.setAttribute('y', 14); bl.setAttribute('text-anchor','middle'); bl.textContent = DATA.belt; g.appendChild(bl);
  sunArt();
  $('noteText').textContent = DATA.notScale;
  $('sunNote').replaceChildren(DATA.sunNote[0], document.createElement('br'), DATA.sunNote[1]);
  const sl = $('slots'); sl.innerHTML = '';
  RADII.forEach((r,i) => {
    const p = slotPos(i), b = document.createElement('button');
    b.type = 'button'; b.className = 'slot'; b.style.left = (p.x / VBW * 100) + '%'; b.style.top = (p.y / 4) + '%';
    b.setAttribute('aria-label', DATA.orbitBtn(i+1)); b.tabIndex = -1; b.dataset.i = i;
    b.addEventListener('click', () => { if (selected) dropOn(i); });
    sl.appendChild(b);
  });
}
function placePlanet(i, isAnchor){
  const p = slotPos(i), id = P[i].id, a = ART[id], s = SIZE[i];
  const w = s * 2 * a.w, h = s * 2 * a.h;
  const g = document.createElementNS(NS,'g'); g.setAttribute('class','placed'); g.dataset.i = i;
  const im = document.createElementNS(NS,'image'); im.setAttribute('href', a.src);
  im.setAttribute('x', p.x - w/2); im.setAttribute('y', p.y - h/2); im.setAttribute('width', w); im.setAttribute('height', h);
  g.appendChild(im);
  const t = document.createElementNS(NS,'text'); t.setAttribute('class','plabel' + (isAnchor ? ' anchor' : ''));
  t.setAttribute('x', p.x); t.setAttribute('y', p.y + s + 16); t.textContent = P[i].name; g.appendChild(t);
  $('gPlanets').appendChild(g);
  const sb = $('slots').children[i]; sb.disabled = true; sb.setAttribute('aria-label', DATA.orbitBtn(i+1) + ': ' + P[i].name);
}

/* ---------- state ---------- */
let queue, roundNo, total, cur, idTries, orbTries, idPts, placed, selected, drag = null;
let teams = false, turn = 0, scores = [0,0], single = 0, maxScore = 0, bonusUsed = false;
const anchorIdx = DATA.anchor ? P.findIndex(p => p.id === DATA.anchor) : -1;

function start(){
  $('gPlanets').innerHTML = ''; $('end').hidden = true;
  [...$('slots').children].forEach(b => { b.disabled = false; b.setAttribute('aria-label', DATA.orbitBtn(+b.dataset.i + 1)); });
  placed = new Set(); scores = [0,0]; single = 0; turn = 0;
  if (anchorIdx > -1){ placePlanet(anchorIdx, true); placed.add(anchorIdx); }
  queue = P.map((_,i) => i).filter(i => i !== anchorIdx);
  for (let i = queue.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i+1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  total = queue.length; maxScore = total * 2; roundNo = 0;
  nextRound();
}
function paintScore(){
  const s = $('score'); s.innerHTML = '';
  if (!teams){ s.textContent = DATA.score(single, maxScore); return; }
  [[DATA.teamA,0],[DATA.teamB,1]].forEach(([n,k], j) => {
    const sp = document.createElement('span'); sp.className = 't' + (turn === k ? ' on' : ''); sp.textContent = `${n}: ${scores[k]}`;
    if (j) s.appendChild(document.createTextNode('  ·  '));
    s.appendChild(sp);
  });
}
function addPoint(n){ if (teams) scores[turn] += n; else single += n; paintScore(); }

function nextRound(){
  if (!queue.length){ showEnd(); return; }
  cur = queue.shift(); roundNo++; idTries = 0; orbTries = 0; idPts = 0; selected = false; bonusUsed = false;
  $('clueCard').hidden = false; $('resultCard').hidden = true;
  $('whoT').textContent = DATA.who;
  $('roundT').textContent = DATA.round(roundNo, total) + (teams ? ` · ${DATA.turn(turn ? DATA.teamB : DATA.teamA)}` : '');
  $('clue').textContent = P[cur].clue;
  $('hint2').hidden = true;
  $('lbl').textContent = ''; $('lbl').className = 'lbl';
  if (roundNo === 1 && anchorIdx > -1) { $('lbl').textContent = DATA.anchorNote; }
  const others = P.map((_,i) => i).filter(i => i !== cur);
  for (let i = others.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i+1)); [others[i], others[j]] = [others[j], others[i]]; }
  const opts = [cur, others[0], others[1]].sort(() => Math.random() - .5);
  const box = $('opts'); box.innerHTML = ''; box.classList.add('wait');
  opts.forEach(i => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt' + (P[i].id === 'saturn' ? ' wide' : ''); b.dataset.i = i;
    b.innerHTML = '<img alt=""><span></span>'; b.querySelector('img').src = ART[P[i].id].src; b.querySelector('span').textContent = P[i].name;
    b.addEventListener('click', () => onPick(b, i));
    b.addEventListener('pointerdown', onDown);
    b.addEventListener('keydown', e => { if (e.key === 'Escape') unselect(); });
    box.appendChild(b);
  });
  paintScore();
  setTimeout(() => {
    box.classList.remove('wait');
    if (!$('lbl').textContent || roundNo !== 1) $('lbl').textContent = DATA.pick;
  }, reduce ? 0 : DATA.optionsDelay);
}

function onPick(b, i){
  if (b.classList.contains('yes')){ toggleSelect(b); return; }
  if (b.disabled || $('opts').querySelector('.yes')) return;
  idTries++;
  if (i === cur){
    if (idTries === 1){ idPts = 1; addPoint(1); }
    [...$('opts').children].forEach(o => { if (o !== b){ o.classList.add('dim'); o.tabIndex = -1; } });
    b.classList.add('yes'); b.setAttribute('aria-label', P[i].name + '. ' + DATA.dragNow(P[i].name));
    $('lbl').textContent = DATA.dragNow(P[i].name); $('lbl').className = 'lbl ok';
  } else {
    b.classList.add('no'); b.disabled = true;
    $('lbl').textContent = DATA.wrongPick; $('lbl').className = 'lbl err';
    $('hint2').textContent = P[cur].hint; $('hint2').hidden = false;
  }
}

/* ---------- choose orbit: drag / click / keyboard ---------- */
function toggleSelect(b){
  if (selected){ unselect(); return; }
  selected = true; b.classList.add('sel'); $('diagram').classList.add('armed');
  [...$('slots').children].forEach(s => { if (!s.disabled) s.tabIndex = 0; });
  const first = [...$('slots').children].find(s => !s.disabled); if (first && document.activeElement === b) first.focus();
}
function unselect(){
  selected = false; const y = $('opts').querySelector('.yes'); if (y) y.classList.remove('sel');
  $('diagram').classList.remove('armed'); [...$('slots').children].forEach(s => s.tabIndex = -1);
}
function svgPoint(cx, cy){
  const r = $('diagram').getBoundingClientRect();
  return { x: (cx - r.left) / r.width * VBW, y: (cy - r.top) / r.height * 400, inside: cx >= r.left - 20 && cx <= r.right + 20 && cy >= r.top - 20 && cy <= r.bottom + 20 };
}
function ringAt(p){
  if (!p.inside) return -1;
  const d = Math.hypot(p.x - SUN.x, p.y - SUN.y);
  let best = -1, bd = Infinity;
  RADII.forEach((r,i) => { const dd = Math.abs(d - r); if (dd < bd){ bd = dd; best = i; } });
  return bd <= 44 ? best : -1;
}
function setOver(i){ document.querySelectorAll('.ring').forEach(c => c.classList.toggle('over', +c.dataset.i === i && !placed.has(i))); }

function onDown(e){
  const b = e.currentTarget;
  if (!b.classList.contains('yes')) return;
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  drag = { b, x0:e.clientX, y0:e.clientY, moved:false, ring:-1 };
  addEventListener('pointermove', onMove); addEventListener('pointerup', onUp, { once:true }); addEventListener('pointercancel', onCancel, { once:true });
}
function onMove(e){
  if (!drag) return;
  if (!drag.moved){
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.moved = true; unselect();
    const im = drag.b.querySelector('img'), r = im.getBoundingClientRect();
    const g = document.createElement('img'); g.src = im.src; g.className = 'dragimg'; g.alt = '';
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    drag.ox = r.width / 2; drag.oy = r.height / 2; drag.home = r; drag.g = g;
    document.body.appendChild(g); drag.b.classList.add('lifting');
  }
  drag.g.style.transform = `translate(${e.clientX - drag.ox}px, ${e.clientY - drag.oy}px)`;
  const i = ringAt(svgPoint(e.clientX, e.clientY));
  if (i !== drag.ring){ drag.ring = i; setOver(i); }
}
function onUp(e){
  removeEventListener('pointermove', onMove); removeEventListener('pointercancel', onCancel);
  if (!drag) return;
  const d = drag; drag = null; setOver(-1);
  if (!d.moved) return;
  const i = ringAt(svgPoint(e.clientX, e.clientY));
  if (i > -1 && !placed.has(i) && dropOn(i)){ d.g.remove(); return; }
  sendBack(d);
}
function onCancel(){ removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp); if (drag && drag.moved) sendBack(drag); drag = null; setOver(-1); }
function sendBack(d){
  if (reduce){ d.g.remove(); d.b.classList.remove('lifting'); return; }
  d.g.classList.add('back');
  requestAnimationFrame(() => { d.g.style.transform = `translate(${d.home.left}px, ${d.home.top}px)`; });
  setTimeout(() => { d.g.remove(); d.b.classList.remove('lifting'); }, 340);
}
$('diagram').addEventListener('click', e => {
  if (!selected || e.target.closest('.slot')) return;
  const i = ringAt(svgPoint(e.clientX, e.clientY)); if (i > -1 && !placed.has(i)) dropOn(i);
});

function flashRing(i, cls){ const c = document.querySelector(`.ring[data-i="${i}"]`); if (!c) return; c.classList.remove(cls); void c.getBBox(); c.classList.add(cls); setTimeout(() => c.classList.remove(cls), 1700); }
function dropOn(i){
  unselect();
  orbTries++;
  if (i === cur){
    if (orbTries === 1) addPoint(1);
    placePlanet(i, false); placed.add(i);
    const y = $('opts').querySelector('.yes'); if (y){ y.classList.remove('lifting'); y.classList.add('dim'); }
    showResult();
    return true;
  }
  flashRing(i, 'miss');
  $('lbl').textContent = DATA.wrongOrbit(P[cur].name, i + 1) + (orbTries >= 2 ? ' ' + DATA.orbitHint : '');
  $('lbl').className = 'lbl err';
  if (orbTries >= 2) setTimeout(() => flashRing(cur, 'hint'), 350);
  return false;
}
function showResult(){
  $('clueCard').hidden = true; $('resultCard').hidden = false;
  $('rName').textContent = P[cur].name;
  $('rSub').textContent = P[cur].sub;
  $('rText').textContent = `כוכב הלכת ה${ORD[cur+1]} מהשמש, ${DATA.groupOne[P[cur].group]}. ${P[cur].info}`;
  $('lbl').textContent = ''; $('lbl').className = 'lbl';
  $('nextBtn').textContent = queue.length ? DATA.next : DATA.finish;
  $('bonusBtn').textContent = DATA.bonus; $('bonusBtn').disabled = false;
  $('nextBtn').focus({preventScroll:true});
}
$('nextBtn').addEventListener('click', () => { if (teams) turn = 1 - turn; nextRound(); });
$('bonusBtn').addEventListener('click', () => { if (bonusUsed) return; bonusUsed = true; addPoint(1); $('bonusBtn').textContent = DATA.bonusGiven; $('bonusBtn').disabled = true; });

/* ---------- end ---------- */
function showEnd(){
  $('eTitle').textContent = DATA.endTitle;
  $('eScore').textContent = teams ? `${DATA.teamA}: ${scores[0]}  ·  ${DATA.teamB}: ${scores[1]}` : DATA.endScore(single, maxScore);
  const L = $('lineup'); L.innerHTML = '';
  const groups = [['rocky',[0,1,2,3]],['gas',[4,5]],['ice',[6,7]]];
  groups.forEach(([g, idx], k) => {
    if (k === 1){ const s = document.createElement('div'); s.className = 'beltsep'; s.title = DATA.belt; L.appendChild(s); }
    const d = document.createElement('div'); d.className = 'grp'; d.style.flexGrow = idx.length;
    const gp = document.createElement('div'); gp.className = 'gp';
    idx.forEach(i => {
      const cell = document.createElement('div'); const im = document.createElement('img');
      const h = Math.round(16 + SIZE[i] * 1.5); im.src = ART[P[i].id].src; im.alt = P[i].name;
      im.style.height = Math.round(h * ART[P[i].id].h) + 'px'; im.style.width = Math.round(h * ART[P[i].id].w) + 'px';
      cell.appendChild(im); cell.appendChild(document.createTextNode(P[i].name)); gp.appendChild(cell);
    });
    const gt = document.createElement('div'); gt.className = 'gt'; gt.textContent = DATA.groups[g];
    d.appendChild(gp); d.appendChild(gt); L.appendChild(d);
  });
  $('eText').textContent = DATA.endText; $('ePluto').textContent = DATA.pluto;
  $('eView').textContent = DATA.endView; $('eAgain').textContent = DATA.endAgain;
  $('end').hidden = false; $('eView').focus();
  $('clueCard').hidden = true; $('resultCard').hidden = true; $('opts').innerHTML = ''; $('lbl').textContent = '';
  try { window.parent.postMessage({ type:'task-done', id:'l3-solar-system-builder' }, '*'); } catch(e){}
}
$('eView').addEventListener('click', () => $('end').hidden = true);
$('eAgain').addEventListener('click', start);

/* ---------- header controls ---------- */
function teamLabel(){ $('teamBtn').textContent = teams ? DATA.oneTeam : DATA.teams; }
$('teamBtn').addEventListener('click', () => { teams = !teams; teamLabel(); start(); });
$('restart').addEventListener('click', start);
addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!$('end').hidden) $('end').hidden = true; else unselect(); } });

/* ---------- stars ---------- */
(function(){
  const cv = $('stars'), cx = cv.getContext('2d');
  function draw(){
    const d = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
    cv.width = W * d; cv.height = H * d; cx.setTransform(d,0,0,d,0,0);
    const g = cx.createRadialGradient(0, H*.38, 0, 0, H*.38, Math.max(W,H)*.9);
    g.addColorStop(0, 'rgba(255,170,80,.08)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = g; cx.fillRect(0,0,W,H);
    const R = rng(11), n = Math.round(W * H / 2400);
    for (let i = 0; i < n; i++){
      const a = .12 + R() * .55, r = R() < .97 ? .3 + R() * .7 : 1.1 + R() * .6;
      cx.fillStyle = `rgba(${R() < .8 ? '220,230,255' : '255,232,205'},${a})`;
      cx.beginPath(); cx.arc(R() * W, R() * H, r, 0, 6.283); cx.fill();
    }
  }
  draw(); let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 150); });
})();

/* ---------- init ---------- */
$('hTitle').textContent = DATA.title; $('hSub').textContent = DATA.instr; $('restart').textContent = DATA.restart;
P.forEach(p => { ART[p.id] = p.id === 'saturn' ? { src: PLANET_IMG.saturn, w: 2.19, h: 1.03 } : { src: PLANET_IMG[p.id], w: 1, h: 1 }; });
buildScene(); teamLabel(); start();
</script>
</body>
</html>
