<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חוזרים על שיעור 2</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--void:#02040a;--ink:#e9eef6;--muted:#97a4ba;--line:rgba(190,210,240,.16);--gold:#d8b46a;--glass:rgba(8,14,28,.72)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(ellipse at 70% 20%,#0b1426,#02040a 70%);color:var(--ink);font-family:Heebo,system-ui,sans-serif;overflow:hidden}
.pick{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:4vh 5vw}
.pick[hidden]{display:none}
.kick{color:var(--gold);font-weight:500;font-size:clamp(14px,1.5vw,20px)}
h1{font-weight:700;font-size:clamp(26px,4vw,54px);line-height:1.15;text-align:center;margin-top:.6vh}
.lede{color:#c3cddd;font-weight:300;font-size:clamp(15px,1.6vw,21px);text-align:center;margin-top:1vh}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2.4vw;width:min(900px,62vw)}
.opt{all:unset;cursor:pointer;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:3.6vh 2.4vw;display:flex;flex-direction:column;gap:1.2vh;transition:border-color .2s,transform .2s}
.opt:hover,.opt:focus-visible{border-color:var(--gold);transform:translateY(-3px)}
.opt b{font-size:clamp(22px,2.8vw,38px);font-weight:700}
.opt p{color:#cfd8e6;font-size:clamp(14px,1.4vw,19px);line-height:1.5}
.opt .meta{display:flex;gap:.8em;flex-wrap:wrap;margin-top:auto;padding-top:1vh}
.opt .meta span{font-size:clamp(12px,1.15vw,15px);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.2em .9em}
.note{color:var(--muted);font-size:clamp(13px,1.2vw,16px)}
.kid{position:fixed;bottom:0;height:min(46vh,40vw);pointer-events:none;z-index:0;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.kid.b{left:1vw}.kid.g{right:1vw}
.pick{position:relative;z-index:1}
@media (max-width:900px){.kid{display:none}}
.play{position:fixed;inset:0;z-index:5}
.play[hidden]{display:none}
.play iframe{border:0;width:100%;height:100%;display:block;background:var(--void)}
.back{position:fixed;bottom:12px;left:12px;z-index:5;font:inherit;font-size:14px;color:var(--ink);background:rgba(6,12,26,.75);border:1px solid var(--line);border-radius:999px;padding:.4em 1.1em;cursor:pointer;backdrop-filter:blur(8px)}
.back:hover{border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

      <p>גוררים כל שם אל הלוויין שלו במסלול: עמוס, ונוס, תבל, האבל, ג'יימס ווב ועוד. מתאים למליאה מול המקרן.</p>
      <div class="meta"><span>7 לוויינים</span><span>כ-4 דקות</span><span>סוגים ומרחקים</span></div>
    </button>
    <button class="opt" type="button" data-game="l3_crossword.html">
      <b>תשבץ</b>
      <p>12 מילים על לוויינים ועל תכנון משימה: תקשורת, ניווט, חיישן, אילוץ ועוד. מתאים לזוגות מול מחשב.</p>

<section class="play" id="play" hidden>
  <button class="back" id="back" type="button">חזרה לבחירת משחק</button>
  <iframe id="frame" title="משחק חזרה"></iframe>
</section>
<script>
const $ = id => document.getElementById(id); const played = new Set();
document.querySelectorAll('.opt').forEach(b => b.onclick = () => { played.add(b.querySelector('b').textContent); $('frame').src = b.dataset.game; $('pick').hidden = true; $('play').hidden = false; $('kidB').hidden = $('kidG').hidden = true; $('back').focus(); });
$('back').onclick = () => { $('frame').src = 'about:blank'; $('play').hidden = true; $('pick').hidden = false; $('kidB').hidden = $('kidG').hidden = false;
  $('done').textContent = played.size ? 'שיחקתם: ' + [...played].join(' · ') : ''; };
</script></body></html>
