<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:Heebo,system-ui,sans-serif;color:#eef2f8}
#st{position:fixed;inset:0;width:100%;height:100%}
.o{position:fixed;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity}

.ic{width:150px;height:150px;margin:-75px 0 0 -75px;opacity:.55;transition:opacity .6s,transform .6s}
.ic img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.ic.cut img{object-fit:contain;border-radius:0}
.ic b{position:absolute;top:112%;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:500;font-size:24px;color:#cfd8e8;text-shadow:0 0 8px #000}
.ic.on{opacity:1}.ic.on b{color:#ffe2a6;font-weight:700}
.ic.on:before{content:"";position:absolute;inset:-10%;border:2px solid #ffe2a6;border-radius:50%;box-shadow:0 0 18px rgba(255,226,166,.6)}
.ic.wait{opacity:0}
#big{width:620px;height:520px;margin:-260px 0 0 -310px;opacity:0;transition:opacity .7s,transform .9s cubic-bezier(.3,.1,.2,1)}
#big img{width:100%;height:100%;object-fit:contain;display:block}
#big.photo img{object-fit:cover;-webkit-mask-image:radial-gradient(ellipse at center,#000 52%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 52%,transparent 72%)}
