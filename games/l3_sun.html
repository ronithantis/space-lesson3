<script>
/* layout works in a 1920x1080 frame scaled to cover the window, like the backgrounds */
let W,H,S,OX,OY;
function size(){W=innerWidth;H=innerHeight;S=Math.max(W/1920,H/1080);OX=(W-1920*S)/2;OY=(H-1080*S)/2;}
const cv=document.getElementById('st'),cx=cv.getContext('2d');
const STARS=Array.from({length:170},()=>[Math.random(),Math.random(),Math.random()*1.2+.3,Math.random()*.55+.15,Math.random()*6.28]);
let twinkle=0;
function stars(t){cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,W,H);
  STARS.forEach(([x,y,r,a,p])=>{const k=twinkle?(.55+.45*Math.sin(t/700+p*3)):1;cx.globalAlpha=a*k;cx.fillStyle='#e3eaff';cx.beginPath();cx.arc(x*W,y*H,r*(twinkle?1.25:1),0,6.283);cx.fill();});cx.globalAlpha=1;}

const sun=document.getElementById('sun'),pl=document.getElementById('pl'),ray=document.getElementById('ray'),dc=document.getElementById('dots'),dx=dc.getContext('2d');
let step=0,dotsT0=0;
const P=(x,y)=>[OX+x*S,OY+y*S];
function place(el,x,y,sc,op){const [a,b]=P(x,y);el.style.transform=`translate(${a}px,${b}px) scale(${sc*S})`;if(op!=null)el.style.opacity=op;}
function layout(){size();
  if(step===0){place(sun,500,540,1,1);place(pl,900,540,.6,0);ray.style.opacity=0;twinkle=0;}
  if(step===1){place(sun,40,540,.9,1);place(pl,700,560,1,1);const [a,b]=P(420,552),[c,d]=P(625,560);ray.style.left=a+'px';ray.style.top=b+'px';ray.style.width=Math.hypot(c-a,d-b)+'px';ray.style.transform=`rotate(${Math.atan2(d-b,c-a)}rad)`;ray.style.opacity=1;twinkle=1;}
  if(step>=2){place(sun,500,540,1.18,1);place(pl,900,540,.6,0);ray.style.opacity=0;twinkle=0;}}
function frame(t){stars(t);dc.width=W*devicePixelRatio;dc.height=H*devicePixelRatio;dx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  if(step>=2){/* 109 Earths side by side across the Sun's diameter */const R=380*1.18*S,[cx0,cy0]=P(500,540),n=109,d=2*R/n,k=Math.min(n,Math.floor((t-dotsT0)/26));
    for(let i=0;i<k;i++){const x=cx0-R+d*(i+.5);dx.fillStyle='#4f93e6';dx.beginPath();dx.arc(x,cy0,d*.46,0,6.283);dx.fill();dx.strokeStyle='rgba(255,255,255,.75)';dx.lineWidth=.6;dx.stroke();}}
  requestAnimationFrame(frame);}
addEventListener('resize',layout);
addEventListener('message',e=>{if(e.data&&e.data.type==='step'){const n=+e.data.n||0;if(n>=2&&step<2)dotsT0=performance.now()+1400;step=n;layout();}});
layout();requestAnimationFrame(frame);

</script></body></html>
