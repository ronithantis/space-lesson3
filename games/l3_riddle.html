<style>
html,body{margin:0;height:100%;background:#03050b;color:#eef2f8;font-family:Heebo,system-ui,sans-serif;overflow:hidden}
#box{position:fixed;left:50%;top:50%;width:min(100vw,160vh);aspect-ratio:16/10;transform:translate(-50%,-50%);overflow:hidden;background:#000;container-type:inline-size}
.img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .7s ease}
.img.on{opacity:1;animation:kb 18s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
#band{position:absolute;left:0;right:0;bottom:0;padding:5cqw 5cqw 3.2cqw;background:linear-gradient(to top,rgba(2,4,10,.94) 0%,rgba(2,4,10,.82) 55%,rgba(2,4,10,0) 100%)}
#title{font-size:3.6cqw;font-weight:800;line-height:1.15;margin:0}
#title.or{color:#ffb44a}#title.bl{color:#8fcbff}#title.gr{color:#86e3a6}
#body{font-size:2.25cqw;line-height:1.45;margin:.8cqw 0 0;max-width:80cqw;color:#f1f4f9}
#nav{display:flex;align-items:center;gap:1.2cqw;margin-top:1.8cqw}
button{font-family:inherit;cursor:pointer}
#next{font-size:1.75cqw;font-weight:700;color:#1a1206;background:#f2c46b;border:0;border-radius:99px;padding:.7cqw 2.2cqw}
#next:hover{background:#ffd88a}
#prev{font-size:1.5cqw;color:#cfd8e8;background:transparent;border:1px solid rgba(207,216,232,.4);border-radius:99px;padding:.6cqw 1.8cqw}
#prev[hidden],#next[hidden],#say[hidden]{display:none}
#say{font-size:1.5cqw;color:#cfd8e8;background:transparent;border:1px solid rgba(207,216,232,.4);border-radius:99px;padding:.6cqw 1.8cqw;margin-inline-start:auto}
#guess{display:flex;gap:1.4cqw;margin-top:1.6cqw}
#guess[hidden]{display:none}
#guess button{font-size:2.1cqw;font-weight:700;color:#eef2f8;background:rgba(255,255,255,.08);border:2px solid rgba(242,196,107,.7);border-radius:1.2cqw;padding:.8cqw 3cqw}
#guess button:hover{background:rgba(242,196,107,.22)}
#verdict{display:inline-block;font-size:1.7cqw;font-weight:700;background:rgba(134,227,166,.16);border:1px solid rgba(134,227,166,.6);color:#c6f5d6;border-radius:99px;padding:.3cqw 1.4cqw;margin-bottom:1cqw}
#verdict[hidden]{display:none}
#dots{position:absolute;top:2.2cqw;right:2.6cqw;display:flex;gap:.6cqw}
#dots i{width:.8cqw;height:.8cqw;border-radius:50%;background:rgba(255,255,255,.25)}
#dots i.on{background:#f2c46b}
#close{position:absolute;top:1.6cqw;left:1.8cqw;font-size:1.6cqw;color:#eef2f8;background:rgba(5,9,20,.6);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:.4cqw 1.6cqw}
#close:hover{background:rgba(5,9,20,.85)}
</style></head><body>

const F = [{"img": "q", "tone": "or", "title": "חידה: מי החם ביותר?", "body": "כוכב חמה הכי קרוב לשמש. נוגה רחוק יותר. אז מי מהם חם יותר?", "next": "לרמז הראשון"}, {"img": "h1", "tone": "bl", "title": "רמז 1: קרוב לשמש", "body": "כוכב חמה מקבל יותר אור וחום מהשמש. אז למה הוא לא החם ביותר?", "next": "רמז נוסף"}, {"img": "h2", "tone": "bl", "title": "רמז 2: החום בורח", "body": "לכוכב חמה כמעט אין אוויר, ולכן החום בורח ממנו לחלל.", "next": "רמז נוסף"}, {"img": "h3", "tone": "bl", "title": "רמז 3: שמיכה עבה", "body": "נוגה עטוף בשכבת אוויר עבה מאוד, שרובה פחמן דו־חמצני.", "next": "לניחוש"}, {"img": "q", "tone": "or", "title": "מה אתם חושבים?", "body": "מי חם יותר: כוכב חמה או נוגה? הצביעו!", "guess": true}, {"img": "rev", "tone": "or", "title": "הפתעה!", "body": "נוגה חם יותר! על פניו יש בערך 465 מעלות – חם מספיק כדי להמיס עופרת.", "next": "למה?"}, {"img": "trap", "tone": "bl", "title": "מלכודת חום", "body": "הקרקע של נוגה פולטת חום. האוויר העבה תופס אותו ומחזיר אותו למטה – כמו שמיכה.", "next": "הבא"}, {"img": "hc", "tone": "bl", "title": "חם וקר", "body": "בכוכב חמה חם מאוד ביום (כ־430 מעלות) וקר מאוד בלילה (כ־180 מעלות מתחת לאפס).", "next": "הבא"}, {"img": "hot", "tone": "bl", "title": "תמיד לוהט", "body": "בנוגה החום נשאר, ולכן חם מאוד גם ביום וגם בלילה.", "next": "לפתרון"}, {"img": "sol", "tone": "gr", "title": "הפתרון: הסוד הוא באוויר!", "body": "כוכב חמה קרוב יותר לשמש, אבל נוגה שומר על החום שלו. לכן נוגה הוא כוכב הלכת החם ביותר!", "next": "סגירה"}];
const $ = s => document.querySelector(s);
let cur = -1, front = $('#iA'), back = $('#iB'), choice = null;
F.forEach(() => $('#dots').appendChild(document.createElement('i')));
function show(i){
  if (i < 0 || i >= F.length) return;
  const f = F[i];
  if (cur < 0 || F[cur].img !== f.img){
    back.style.backgroundImage = `url(${IMG[f.img]})`; back.classList.remove('on'); void back.offsetWidth; back.classList.add('on'); front.classList.remove('on');
    [front, back] = [back, front];
  }
  cur = i; speak();
  $('#title').textContent = f.title; $('#title').className = f.tone; $('#body').textContent = f.body;
  $('#guess').hidden = !f.guess; $('#next').hidden = !!f.guess; $('#next').textContent = f.next || '';
  $('#prev').hidden = i === 0;
  const v = $('#verdict'); v.hidden = !(f.img === 'rev' && choice);
  if (choice) v.textContent = choice === 'v' ? 'ניחשתם נכון!' : 'מפתיע, נכון?';
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k <= i));
}
/* narration: audio/l3_rd1_he.mp3 ... l3_rd10_he.mp3; the button appears only when the clip exists */
const AU = new Audio();
function speak(){ AU.pause(); $('#say').hidden = true; AU.src = `../audio/l3_rd${cur+1}_he.mp3`; AU.oncanplay = () => { $('#say').hidden = false; }; AU.play().catch(() => {}); }
const close = () => { AU.pause(); try { parent.postMessage({type:'riddle-close'}, '*'); } catch(e){} };
$('#next').onclick = () => cur === F.length - 1 ? close() : show(cur + 1);
$('#prev').onclick = () => show(cur - 1);
$('#close').onclick = close;
$('#say').onclick = () => { AU.currentTime = 0; AU.play().catch(() => {}); };
document.querySelectorAll('#guess button').forEach(b => b.onclick = () => { choice = b.dataset.g; show(cur + 1); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') close();
  else if ((e.key === 'ArrowLeft' || e.key === ' ') && !F[cur].guess){ e.preventDefault(); $('#next').click(); }
  else if (e.key === 'ArrowRight') show(cur - 1);
});
addEventListener('message', e => { if (e.data && e.data.type === 'riddle-start'){ choice = null; cur = -1; show(0); } });
show(0);
</script></body></html>
